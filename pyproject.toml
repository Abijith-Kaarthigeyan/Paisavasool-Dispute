[project]
name = "paisavasool-dispute-service"
version = "0.1.0"
description = "Dispute Lifecycle Management microservice for the Paisa Vasool platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.2",
    "asyncpg>=0.29.0",
    "email-validator>=2.1.1",
    "fastapi>=0.111.0",
    "httpx>=0.27.0",
    "psycopg2-binary>=2.9.9",
    "pydantic-settings>=2.3.4",
    "python-jose[cryptography]>=3.3.0",
    "redis>=5.0.7",
    "celery>=5.3.0",
    "sqlalchemy>=2.0.31",
    "uvicorn[standard]>=0.30.1",
    "langgraph>=1.2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "aiosqlite>=0.20.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "N",
    "SIM",
    "C4",
]
ignore = ["N818", "E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.params.Depends",
    "Depends",
    "fastapi.Query",
    "fastapi.params.Query",
    "Query",
    "fastapi.File",
    "fastapi.params.File",
    "File",
    "fastapi.Path",
    "fastapi.params.Path",
    "Path",
    "fastapi.Form",
    "fastapi.params.Form",
    "Form",
    "fastapi.Body",
    "fastapi.params.Body",
    "Body",
    "fastapi.Header",
    "fastapi.params.Header",
    "Header",
    "fastapi.Cookie",
    "fastapi.params.Cookie",
    "Cookie",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "src.core.services.*",
    "src.core.exceptions.*",
    "src.api.rest.routes.*",
    "src.api.rest.dependencies.*",
    "src.api.middleware.*",
    "src.data.models.*",
    "src.data.repositories.*",
    "src.data.migrations.*",
    "tests.*",
    "main",
]
ignore_errors = true
